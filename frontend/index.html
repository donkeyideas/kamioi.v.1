<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kamioi - Turn Everyday Spending into Stock Ownership</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Primary Meta Tags -->
    <meta name="description" content="Kamioi adds your chosen round-up amount to every purchase and invests it into real stocks. Transform your spending into wealth — no minimum balance required." />
    <meta name="keywords" content="micro-investing, round-up investing, spare change investing, automated investing, stock ownership, portfolio builder, Kamioi" />
    <meta name="author" content="Kamioi" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kamioi.com/" />
    <meta property="og:title" content="Kamioi - Turn Everyday Spending into Stock Ownership" />
    <meta property="og:description" content="Add your chosen round-up amount to every purchase and invest it into real stocks automatically. Transform your spending into wealth." />
    <meta property="og:image" content="https://kamioi.com/favicon.png" />
    <meta property="og:site_name" content="Kamioi" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://kamioi.com/" />
    <meta name="twitter:title" content="Kamioi - Turn Everyday Spending into Stock Ownership" />
    <meta name="twitter:description" content="Add your chosen round-up amount to every purchase and invest it into real stocks automatically. Transform your spending into wealth." />
    <meta name="twitter:image" content="https://kamioi.com/favicon.png" />

    <!-- Canonical -->
    <link rel="canonical" href="https://kamioi.com/" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#7C3AED" />
    <meta name="msapplication-TileColor" content="#7C3AED" />

    <!-- Mobile App Smart Banners (once apps are live) -->
    <meta name="apple-itunes-app" content="app-id=XXXXXXXXX" />
    <meta name="google-play-app" content="app-id=com.kamioi.app" />

    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://oihrbeyprqqoahocswgk.supabase.co" />

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Kamioi",
      "url": "https://kamioi.com",
      "logo": "https://kamioi.com/favicon.png",
      "description": "Kamioi adds your chosen round-up amount to every purchase and invests it into real stocks. AI-powered micro-investing for everyone.",
      "foundingDate": "2025",
      "sameAs": [],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer support",
        "url": "https://kamioi.com/contact"
      }
    }
    </script>

    <!-- Structured Data: WebSite with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Kamioi",
      "url": "https://kamioi.com",
      "description": "Turn everyday spending into stock ownership with automatic round-up investing.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://kamioi.com/blog?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Structured Data: WebPage with Speakable -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebPage",
      "name": "Kamioi - Turn Everyday Spending into Stock Ownership",
      "url": "https://kamioi.com",
      "description": "Kamioi adds your chosen round-up amount to every purchase and invests it into real stocks. Transform your spending into wealth — no minimum balance required.",
      "speakable": {
        "@type": "SpeakableSpecification",
        "cssSelector": ["title", "meta[name='description']"]
      }
    }
    </script>

    <!-- Structured Data: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Kamioi",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "Web, iOS, Android",
      "description": "Automatic round-up micro-investing app that turns everyday purchases into real stock ownership.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD",
        "description": "Free tier available"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "ratingCount": "5",
        "bestRating": "5"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
